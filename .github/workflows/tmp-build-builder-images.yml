# TEMPORARY (CON-1467): builds and pushes the three builder images once so their
# digests can be pinned in matrix.json and the workflows. Delete this file after
# copying the digests from the job summary.
name: TEMP build builder images

on:
  push:
    branches:
      - feat/CON-1467-cu132-torch2.13
    paths:
      - .github/workflows/tmp-build-builder-images.yml

permissions:
  contents: read

concurrency:
  group: tmp-build-builder-images
  cancel-in-progress: false

jobs:
  builder:
    name: builder-${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [cu128, cu130, cu132]
    env:
      IMAGE_REPOSITORY: runpod/sageattention-wheel-builder
    steps:
      - name: Require Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "::error::Add repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a token with write access to runpod/sageattention-wheel-builder), then re-run."
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # CUDA dev packages plus torch need more than the runner's free disk.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@783ae9cac559640a24c9212dfa6cd9e998252f9a
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push builder-${{ matrix.variant }}
        run: |
          IMAGE_TAG="bootstrap-$(git rev-parse --short=12 HEAD)"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "${GITHUB_ENV}"
          IMAGE_TAG="${IMAGE_TAG}" docker buildx bake -f docker/docker-bake.hcl \
            "builder-${{ matrix.variant }}" --push

      - name: Print digest
        run: |
          ref="${IMAGE_REPOSITORY}:${IMAGE_TAG}-${{ matrix.variant }}"
          digest="$(docker buildx imagetools inspect "${ref}" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "${{ matrix.variant }}: ${IMAGE_REPOSITORY}@${digest}"
          echo "${{ matrix.variant }}: \`${IMAGE_REPOSITORY}@${digest}\` (tag \`${ref}\`)" >> "${GITHUB_STEP_SUMMARY}"
